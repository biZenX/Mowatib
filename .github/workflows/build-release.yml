name: Build and Update Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Mowatib Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Release APK
        run: ./gradlew assembleFullRelease --no-daemon --no-build-cache --stacktrace

      - name: Locate and prepare APK
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/full/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found in app/build/outputs/apk/full/release"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/Mowatib-v1.0.0.apk
          ls -la dist/

      - name: Upload APK to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading Mowatib-v1.0.0.apk to release v1.0.0..."
          gh release upload v1.0.0 dist/Mowatib-v1.0.0.apk --clobber

      - name: Upload artifact as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Mowatib-v1.0.0-apk
          path: dist/Mowatib-v1.0.0.apk
